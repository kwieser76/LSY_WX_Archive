# Saves every METAR, SPECI and TAF (incl. AMD, COR, RTD) of the airports in airports.json, every 10 minutes.
# Copy to .github/workflows/wx-capture.yml in the public repository kwieser76/LSY_WX_Archive (branch main).
# The script is scripts/capture-wx-reports.js (Node 20, no dependencies). MET Norway keeps 24 hours, so late
# or skipped runs lose nothing. The archive (last 21 days, one gzip file per UTC day) lives on the branch
# "data" as ONE orphan commit, force-pushed each run, so the repository does not grow with every run.
# Review 2026-10-13: a failed restore stops the run (until then it counted as "no branch yet", and the force-push
# would have replaced 21 days with 24 hours); a restored day file missing before the push stops it too; a 403/429
# leaves a stop note (archive/blocked.json) that the next runs respect for 24 h, and the run ends red; once a month a
# scheduled run commits KEEPALIVE to main, because GitHub disables the schedule of a public repo after 60 days
# without a commit (the force-push to "data" is not reliably counted as activity).
# v1.8.0 (2026-10-13): every 10 minutes at off-peak minutes (GitHub dropped 18 of 20 hourly slots at :17; :00 and :30
# are its busiest). MET Norway is still asked once an hour (the script decides from state.json lastMetNorwayTry); the
# runs in between read the two whole-world cache files of the NOAA/NWS Aviation Weather Center (public domain) and
# write the same day files plus archive/latest.json.gz. The concurrency group keeps runs from overlapping.
# Gate (2026-10-13, v1.10.0): GitHub's schedule (:04, :14 …) and cron-job.org (:09, :19 …, tools/wx-archive/CRON-JOB-SETUP.md)
# both start runs, 12 an hour. A run without "force" now ends at once, before any request to a source, when archive/state.json
# on the data branch was checked less than 7 minutes ago: about 6 runs an hour whichever clock is working. When the check
# cannot read state.json the run goes ahead (the archive feeds the Monday briefing; a gate must never stop it). By hand
# with "force" ticked (gh workflow run wx-capture.yml -R kwieser76/LSY_WX_Archive -f force=true) a run always runs.
name: WX report capture

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the archive was updated less than 7 minutes ago (tick when starting by hand)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wx-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run only when the archive was not updated in the last 7 minutes (by hand with force always; no answer = run)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "Started by hand with force - runs."; exit 0; fi
          at="$(gh api -H "Accept: application/vnd.github.raw" "repos/${{ github.repository }}/contents/archive/state.json?ref=data" 2>/dev/null | jq -r '.checkedAt // empty' 2>/dev/null || true)"
          as="$(date -u -d "$at" +%s 2>/dev/null || echo 0)"; now=$(date -u +%s)
          if [ -n "$at" ] && [ "$as" -gt 0 ] && [ $(( now - as )) -lt 420 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Archive checked at $at, $(( (now - as) / 60 )) min ago - nothing to do (${{ github.event_name }})."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Archive last checked ${at:-unknown} - runs (${{ github.event_name }})."
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep the schedule alive (a commit to main when the last one is older than 30 days)
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          last="$(git log -1 --format=%ct)"
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf 'Last keep-alive commit: %s. GitHub disables the schedule after 60 days without a commit.\n' "$(date -u +%Y-%m-%d)" > KEEPALIVE
            git add KEEPALIVE
            git commit -q -m "Keep-alive $(date -u +%Y-%m-%d)"
            git push -q origin HEAD:main || echo "::warning title=WX capture::keep-alive commit not pushed (main moved?) - the next scheduled run tries again"
          else
            echo "Last commit on main $(( ($(date +%s) - last) / 86400 )) day(s) ago - no keep-alive needed."
          fi

      - name: Set up Node 20
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore the archive from the data branch (no branch yet = start fresh; any other failure = stop)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/store"
          : > "$RUNNER_TEMP/restored.txt"
          # ls-remote answers empty (exit 0) when there is no branch "data", and fails when GitHub is not reachable.
          heads="$(git ls-remote --heads origin data)" || { echo "::error title=WX capture::git ls-remote failed - nothing captured, nothing published"; exit 1; }
          if [ -z "$heads" ]; then
            echo "No data branch yet - starting fresh."
          else
            git fetch -q --depth=1 origin data || { echo "::error title=WX capture::the data branch exists but could not be fetched - nothing captured, nothing published"; exit 1; }
            git ls-tree -r --name-only FETCH_HEAD archive/ | sed -n 's#^archive/##p' > "$RUNNER_TEMP/restored.txt"
            if [ -s "$RUNNER_TEMP/restored.txt" ]; then
              git --work-tree="$RUNNER_TEMP/store" checkout FETCH_HEAD -- archive
              git reset -q
            fi
          fi
          echo "$(grep -c 'ndjson.gz$' "$RUNNER_TEMP/restored.txt" || true) day file(s) restored"
          ls -R "$RUNNER_TEMP/store" | head -40

      - name: Capture METAR/TAF (MET Norway hourly, AWC cache files in between; appends only reports not stored yet, drops days older than 21)
        if: steps.gate.outputs.run == 'true'
        run: WX_ARCHIVE_DIR="$RUNNER_TEMP/store/archive" node scripts/capture-wx-reports.js

      - name: Publish the archive to the data branch (one orphan commit, force-pushed)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          [ -d "$RUNNER_TEMP/store/archive" ] || { echo "No archive yet - nothing to publish."; exit 0; }
          node scripts/capture-wx-reports.js --verify-publish "$RUNNER_TEMP/restored.txt" "$RUNNER_TEMP/store/archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q --orphan data-publish
          git rm -rq --cached . 2>/dev/null || true
          rm -rf archive && cp -R "$RUNNER_TEMP/store/archive" archive
          printf 'METAR/TAF archive, last 21 days, and latest.json.gz. Data from MET Norway (CC BY 4.0) and the NOAA/NWS Aviation Weather Center (public domain). See the main branch.\n' > README.md
          git add archive README.md
          git commit -q -m "WX archive $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force origin HEAD:refs/heads/data

      # After the publish the work tree is the orphan data commit: back to main for the script.
      - name: Fail the run while a stop note is in force or a day file did not decode
        if: steps.gate.outputs.run == 'true'
        run: |
          git switch -q main
          WX_ARCHIVE_DIR="$RUNNER_TEMP/store/archive" node scripts/capture-wx-reports.js --check
# Plan B if MET Norway fails: the AWC cache files (the runs between MET Norway's) hold the newest METAR and TAF of every
# station, but no history; api.weather.gov serves US stations only (METAR + TAF).
